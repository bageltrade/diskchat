plugins {
    id 'com.android.application'
}
android {
    namespace 'com.bageltrade.diskchat'
    compileSdk 34
    defaultConfig {
        applicationId "com.bageltrade.diskchat"
        minSdk 26
        targetSdk 34
        versionCode 25
        versionName "2.5.1"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
