<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<title>DiskChat</title>
<link rel="stylesheet" href="/static/app.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='14' width='64' height='64' fill='%236ee7b7'/%3E%3Ctext x='50%25' y='54%25' text-anchor='middle' font-size='28' font-family='system-ui' fill='%230b0f14'%3EDC%3C/text%3E%3C/svg%3E" />
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">DC</div>
      <div>
        <div class="title">DiskChat</div>
        <div class="sub" id="version">mmap · low RAM</div>
      </div>
    </div>
    <div class="panel">
      <label>Model (GGUF path)</label>
      <input id="modelPath" type="text" placeholder="/path/to/model.gguf" />
      <button class="btn ghost" id="btnListModels">Scan models</button>
      <div id="modelList" class="model-list"></div>
    </div>
    <div class="panel row">
      <label class="check"><input type="checkbox" id="agentMode" /> Agent / tools</label>
      <label class="check"><input type="checkbox" id="extreme" checked /> Extreme low RAM</label>
    </div>
    <div class="panel">
      <label>RAM budget (MB)</label>
      <input id="ramBudget" type="number" value="1536" min="256" step="128" />
    </div>
    <div class="panel stats" id="stats">
      <div><span>Status</span><b id="stHealth">…</b></div>
      <div><span>Backend</span><b id="stBackend">—</b></div>
      <div><span>RSS</span><b id="stRss">—</b></div>
    </div>
    <div class="panel actions">
      <button class="btn" id="btnNew">New chat</button>
      <button class="btn ghost" id="btnDoctor">Doctor</button>
    </div>
    <p class="foot">Weights stay on disk · process stays light</p>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      <div class="top-title">Chat</div>
      <div id="conn" class="pill offline">offline</div>
    </header>
    <section id="messages"></section>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message DiskChat…" autocomplete="off"></textarea>
      <button type="submit" id="send" class="btn send" title="Send">➤</button>
    </form>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
